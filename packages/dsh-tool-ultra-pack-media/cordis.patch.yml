# @lvy-jsd/dsh-tool-ultra-pack-media bundle patch: one loader entry.
- insert:
    - id: tool-ultra-pack-media
      name: '@lvy-jsd/dsh-tool-ultra-pack-media'
      config:
        # Tools to leave out, by name (e.g. [chart_render]).
        disable: []
        # Folder that receives every generated file. Unset: ~/dsh-creations.
        # outputDir: /srv/swiftnest/creations
        # Largest HTML page html_render accepts, in bytes.
        maxHtmlBytes: 2000000
        # Font files html_render loads before the host's own (found with fontconfig).
        fontFiles: []
        # Default page language; zh-CN picks Simplified Chinese glyphs.
        lang: zh-CN
        # Largest SVG source accepted, in bytes.
        maxSvgBytes: 2000000
        # Largest output image, in pixels (width x height): 4096 x 4096.
        maxPixels: 16777216
        # Longest piece music_render accepts, in seconds, and most notes in one piece.
        maxMusicSeconds: 300
        maxMusicNotes: 5000
        # A local SoundFont (.sf2/.sf3) for music_render. Empty: download the
        # default (FluidR3 Mono GM, ~24 MB) once from soundfontUrl into modelCacheDir.
        soundfont: ''
        soundfontUrl: 'https://raw.githubusercontent.com/musescore/MuseScore/3.x/share/sound/FluidR3Mono_GM.sf3'
        # Longest video video_render makes, in seconds.
        maxVideoSeconds: 180
        # ffmpeg and ffprobe used by the video and speech tools, and how long
        # one run may take (ms).
        ffmpegPath: ffmpeg
        ffprobePath: ffprobe
        ffmpegTimeoutMs: 300000
        # Extra folders whose files audio_transcribe and video_understand may read by absolute path.
        inputDirs: []
        # Speech model for audio_transcribe: sensevoice (Chinese, Cantonese, English,
        # Japanese, Korean; also emotions and sounds) or whisper-turbo (about 100
        # languages, slower). A language SenseVoice does not read always goes to Whisper.
        speechModel: sensevoice
        # Where the speech models download from (the sherpa-onnx releases on GitHub,
        # or a mirror of them), CPU threads, and the longest audio per call.
        modelMirror: 'https://github.com/k2-fsa/sherpa-onnx/releases/download/'
        speechThreads: 4
        maxTranscribeSeconds: 1800

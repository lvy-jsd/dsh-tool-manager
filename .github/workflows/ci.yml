name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 22
    env:
      # scripts/link-host.mjs links the DSH host packages from here, the same
      # way it links a real DSH install on a developer machine.
      DSH_APP: ${{ github.workspace }}/../dsh-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install DSH host packages
        shell: bash
        run: |
          mkdir -p "$DSH_APP"
          cd "$DSH_APP"
          npm init -y > /dev/null
          npm install --no-audit --no-fund \
            @deepseek-ai/dsh-tools@0.2.1-rc.5 \
            @deepseek-ai/dsh-llm \
            @deepseek-ai/dsh-scope

      # The media pack's real tests need ffmpeg, and html_render's Chinese text test needs a CJK font;
      # Linux runners always run them.
      - name: Install ffmpeg and fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk fonts-noto-color-emoji

      - name: Build the Rust sidecar
        if: runner.os == 'Linux'
        run: npm run build:sidecar

      # npm install also runs the link-host postinstall and the TypeScript build.
      - run: npm install --no-audit --no-fund

      - run: npm run typecheck

      # The e2e run (test/e2e.mjs) boots a full DSH: see the e2e job.
      # On Linux the speech test also downloads a small Whisper model and transcribes a sample.
      - run: node --test test/unit/*.test.mjs
        env:
          MEDIA_SPEECH_E2E: ${{ runner.os == 'Linux' && '1' || '' }}

  e2e:
    name: e2e (dsh ${{ matrix.dsh }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The version Swiftnest pins, and the next one.
        dsh: [0.2.1-rc.5, 0.2.2-alpha.3]
    env:
      DSH_APP: ${{ github.workspace }}/../dsh-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install DSH
        run: |
          mkdir -p "$DSH_APP"
          cd "$DSH_APP"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts @deepseek-ai/dsh@${{ matrix.dsh }}

      - run: npm install --no-audit --no-fund

      # Boots a full DSH per scenario against a scripted fake model.
      - run: node test/e2e.mjs "$DSH_APP/node_modules/.bin/dsh"

  sidecar:
    name: sidecar (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: clippy and tests
        working-directory: packages/dsh-tool-ultra-core/sidecar
        run: |
          cargo clippy --release -- -D warnings
          cargo test --release
